<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7ab8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ab8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#6fdc8c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#2a2d34" stroke-width="1.5"/>

  <!-- target/radar icon: precision job matching -->
  <g transform="translate(150,140)">
    <circle r="86" fill="none" stroke="#2a2d34" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#3a3f48" stroke-width="2"/>
    <circle r="34" fill="none" stroke="#7ab8ff" stroke-width="2.5" opacity="0.85"/>
    <line x1="-100" y1="0" x2="-92" y2="0" stroke="#3a3f48" stroke-width="2"/>
    <line x1="92" y1="0" x2="100" y2="0" stroke="#3a3f48" stroke-width="2"/>
    <line x1="0" y1="-100" x2="0" y2="-92" stroke="#3a3f48" stroke-width="2"/>
    <line x1="0" y1="92" x2="0" y2="100" stroke="#3a3f48" stroke-width="2"/>
    <circle r="7" fill="#6fdc8c"/>
    <circle r="7" fill="#6fdc8c" opacity="0.35">
      <animate attributeName="r" values="7;22;7" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M 30 -46 L 46 -54 L 40 -36 Z" fill="#7ab8ff"/>
    <line x1="8" y1="-24" x2="34" y2="-42" stroke="#7ab8ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(272,120)">
    <text x="0" y="0" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#e8e8e8">Cross<tspan fill="url(#accentText)">Job</tspan><tspan fill="#7ab8ff">-AI</tspan></text>
    <text x="2" y="44" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#99a3ad">Поиск и автоотклик на вакансии — без ручной рутины</text>
    <g font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#99a3ad">
      <text x="2" y="88">HeadHunter</text>
      <circle cx="98" cy="83" r="2.5" fill="#3a3f48"/>
      <text x="112" y="88">SuperJob</text>
      <circle cx="196" cy="83" r="2.5" fill="#3a3f48"/>
      <text x="210" y="88">Zarplata.ru</text>
      <circle cx="310" cy="83" r="2.5" fill="#3a3f48"/>
      <text x="324" y="88">LinkedIn</text>
      <circle cx="408" cy="83" r="2.5" fill="#3a3f48"/>
      <text x="422" y="88">Telegram</text>
    </g>
  </g>
</svg>
