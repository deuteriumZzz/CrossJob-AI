name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt
          pip install black==24.10.0 isort==6.1.0 flake8==6.1.0 mypy==1.19.1 \
            types-PyYAML==6.0.12.20250915 types-requests==2.32.4.20260107

      - name: black
        run: black --line-length 79 --check .

      - name: isort
        run: isort --profile black --line-length 79 --check .

      # --select=E,F only: this repo's local flake8 has isort/naming/
      # return plugins installed that disagree with the isort/black
      # settings actually used above (pre-existing noise, not real
      # issues) — E/F (pyflakes + real pycodestyle errors) is the
      # actual gate, same as every manual check this project runs.
      # E704 ignored: black deliberately keeps `def f(...) -> T: ...`
      # Protocol stubs on one line (verified — black reverts a
      # multi-line split back). E203 ignored: black adds a space
      # before `:` in slices with a non-trivial expression (e.g.
      # `x[len(prefix) :]`), which E203 flags — a known black/flake8
      # conflict, not a real style issue. Per-file E501 ignores below
      # are all unsplittable template/fixture strings, not real code:
      # config.py has a URL inside a vendored HTML template;
      # autostart.py has the required macOS plist DOCTYPE line;
      # test_habr_career_mapping.py and test_himalayas_mapping.py have
      # raw HTML test fixtures; resume_audit.py has natural-language
      # LLM prompt text.
      - name: flake8
        run: |
          flake8 --max-line-length=79 --select=E,F \
            --extend-ignore=E704,E203 \
            --per-file-ignores="src/libs/resume_and_cover_builder/config.py:E501,src/utils/autostart.py:E501,tests/test_habr_career_mapping.py:E501,tests/test_himalayas_mapping.py:E501,src/job_sources/resume_audit.py:E501"

      - name: mypy
        run: mypy --ignore-missing-imports main.py src desktop_app.py

      - name: pytest
        run: python -m pytest tests/ -q
