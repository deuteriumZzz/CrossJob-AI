name: Build desktop app

# PyInstaller не кросс-компилирует (см. docs/GUIDE.md#сборка-в-exe-
# macos-и-windows) — поэтому здесь matrix из macos-latest и
# windows-latest, каждый собирает свой .app/.exe на своей ОС.
#
# Тег вида v1.2.3 собирает и публикует релиз на GitHub с обоими
# архивами. Ручной запуск (workflow_dispatch, без тега) только
# собирает и прикладывает артефакты к самому запуску — удобно
# проверить сборку, не создавая релиз.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset_name: CrossJob-AI-macOS.zip
          - os: windows-latest
            asset_name: CrossJob-AI-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ponytail: setuptools>=81 удалило pkg_resources.NullProvider,
          # от которого зависит собственный runtime-hook PyInstaller
          # (pyi_rth_pkgres) — без пина собранное приложение падает
          # сразу при старте. Найдено вживую 2026-09-03, см.
          # docs/GUIDE.md#сборка-в-exe-macos-и-windows.
          pip install "setuptools<81"
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller desktop_app.spec

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "CrossJob-AI.app" "../${{ matrix.asset_name }}"

      - name: Package Windows build
        if: runner.os == 'Windows'
        run: |
          cd dist/CrossJob-AI
          Compress-Archive -Path * -DestinationPath "../../${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}"

  publish-release:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
