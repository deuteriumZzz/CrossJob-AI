remote: true
hybrid: true
onsite: true

experience_level:
  internship: false
  entry: true
  associate: true
  mid_senior_level: true
  director: false
  executive: false

job_types:
  full_time: true
  contract: false
  part_time: false
  temporary: true
  internship: false
  other: false
  volunteer: true

date:
  all_time: false
  month: false
  week: false
  24_hours: true

# Leave empty ("positions: []") to auto-infer 2-4 positions from
# data_folder/resume.pdf via LLM instead of listing them by hand.
positions:
  - Software engineer

locations:
  - Germany

# Optional: used only for auto-replying to employer messages
# (headhunter.auto_reply) — gives the LLM a concrete number instead
# of guessing when asked about salary expectations.
salary_expectations: "250000-300000 RUR"

apply_once_at_company: true

distance: 100

company_blacklist:
  - wayfair
  - Crossover

title_blacklist:
  - word1
  - word2

location_blacklist:
  - Brazil

# schedule_enabled/interval_hours (опционально, для `python main.py
# --daemon` вместо внешнего cron) можно добавить в блок ЛЮБОГО
# источника, включая те, у которых своего блока ниже ещё нет (geekjob,
# rabota_ru, getmatch) — просто впишите блок с этими двумя полями.
# По умолчанию schedule_enabled: false — демон не трогает источник,
# пока его явно не включили.

# Optional: only needed for the "Search & Apply on HeadHunter" action.
# Login is a real browser window (phone number + SMS code, see
# secrets.yaml), not an API — so there's no resume_id field here:
# whichever resume hh.ru shows as default in the response popup is
# what gets used. Search always covers all of Russia regardless of any
# city filter saved on your account, since remote work has no region.
headhunter:
  # Set to true to actually submit applications instead of a dry run.
  auto_apply: false
  schedule_enabled: false
  interval_hours: 3
  # Optional: auto-reply to employer questions in the hh.ru chat via
  # LLM (salary questions, screening questions). Messages that don't
  # actually need a reply (status updates, HH's own automated notices)
  # are silently skipped, not answered. Off by default like every
  # other auto_* flag — read docs/GUIDE.md first, this is a
  # best-effort browser flow.
  # If the employer's message contains a link to an external form
  # (e.g. a Google Form), it's never filled in and submitted on its
  # own: the bot reads the form's questions, drafts answers from your
  # resume, and sends the draft to your Telegram (notifications: below)
  # for a live decision — reply "да <id>" to submit as drafted,
  # "заново <id>" to regenerate the draft, or
  # "правка <id> <question number> <new answer>" to fix one answer.
  # Nothing is entered on the third-party site until you approve.
  auto_reply: false

# Optional: only needed for the "Search & Apply on SuperJob" action.
superjob:
  auto_apply: false
  # An existing resume ID from your superjob.ru profile (used as-is, not regenerated).
  resume_id: "your-superjob-ru-resume-id"
  schedule_enabled: false
  interval_hours: 3

# Optional: only needed for the "Search & Apply on Zarplata.ru" action.
zarplata:
  auto_apply: false
  # An existing resume ID from your zarplata.ru profile (used as-is, not regenerated).
  resume_id: "your-zarplata-ru-resume-id"
  schedule_enabled: false
  interval_hours: 3

# Optional: only needed for the "Search & Apply on GetMatch" action.
# Keep auto_apply: false until you've logged in once (first auto_apply
# run opens a real browser window and waits for you to type the code
# GetMatch sends to your Telegram) — see docs/GUIDE.md.
getmatch:
  auto_apply: false

# Optional: only needed for the "Search & Apply on geekjob.ru" /
# "Search & Apply on rabota.ru" actions. Both log in only via OAuth
# (Google, VK, Mail.Ru, etc.) — no password is ever entered by code,
# you complete login by hand in the browser window that opens on the
# first auto_apply run. Best-effort: unlike HH/GetMatch, the actual
# apply button was never confirmed against a live logged-in session
# (see docs/GUIDE.md) — if the button isn't found, it just falls back
# to dry-run.
geekjob:
  auto_apply: false

rabota_ru:
  auto_apply: false

# Optional: only needed for the "Search Telegram channels" action.
# `positions` above is reused as the search keywords.
telegram:
  channels:
    - some_public_job_channel
  messages_per_channel: 100

# Optional: only needed for the "Search & Apply on LinkedIn" action.
# Keep auto_apply: false until you've reviewed a dry run's generated
# screening-question answers — this flow is unverified against a live
# LinkedIn account, see docs/GUIDE.md.
linkedin:
  auto_apply: false
  location: "Germany"

