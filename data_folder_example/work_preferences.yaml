remote: true
hybrid: true
onsite: true

experience_level:
  internship: false
  entry: true
  associate: true
  mid_senior_level: true
  director: false
  executive: false

job_types:
  full_time: true
  contract: false
  part_time: false
  temporary: true
  internship: false
  other: false
  volunteer: true

date:
  all_time: false
  month: false
  week: false
  24_hours: true

# Leave empty ("positions: []") to auto-infer 2-4 positions from
# data_folder/resume.pdf via LLM instead of listing them by hand.
positions:
  - Software engineer

locations:
  - Germany

# Optional: used only for auto-replying to employer messages
# (headhunter.auto_reply) — gives the LLM a concrete number instead
# of guessing when asked about salary expectations.
salary_expectations: "250000-300000 RUR"

apply_once_at_company: true

distance: 100

company_blacklist:
  - wayfair
  - Crossover

title_blacklist:
  - word1
  - word2

location_blacklist:
  - Brazil

# schedule_enabled/interval_hours (опционально, для `python main.py
# --daemon` вместо внешнего cron) можно добавить в блок ЛЮБОГО
# источника, включая те, у которых своего блока ниже ещё нет (geekjob,
# getmatch) — просто впишите блок с этими двумя полями.
# По умолчанию schedule_enabled: false — демон не трогает источник,
# пока его явно не включили.

# Optional: only needed for the "Search & Apply on HeadHunter" action.
# Login is a real browser window (phone number + SMS code, see
# secrets.yaml), not an API — so there's no resume_id field here:
# whichever resume hh.ru shows as default in the response popup is
# what gets used. Search always covers all of Russia regardless of any
# city filter saved on your account, since remote work has no region.
headhunter:
  # Set to true to actually submit applications instead of a dry run.
  auto_apply: false
  schedule_enabled: false
  interval_hours: 3
  # Optional: auto-reply to employer questions in the hh.ru chat via
  # LLM (salary questions, screening questions). Messages that don't
  # actually need a reply (status updates, HH's own automated notices)
  # are silently skipped, not answered. Off by default like every
  # other auto_* flag — read docs/GUIDE.md first, this is a
  # best-effort browser flow.
  # If the employer's message contains a link to an external form
  # (e.g. a Google Form), it's never filled in and submitted on its
  # own: the bot reads the form's questions, drafts answers from your
  # resume, and sends the draft to your Telegram (notifications: below)
  # for a live decision — reply "да <id>" to submit as drafted,
  # "заново <id>" to regenerate the draft, or
  # "правка <id> <question number> <new answer>" to fix one answer.
  # Nothing is entered on the third-party site until you approve.
  auto_reply: false
  # Optional: click the "Обновить" (bump/refresh) button on your resume
  # before each run — a free alternative to HH's paid "raise resume in
  # search" service. Needs resume_id (below) set. Off by default: the
  # selector for this button has NOT been confirmed against a live
  # logged-in account yet — verify it works before relying on it. HH
  # itself enforces the cooldown (usually ~4h per resume) and just
  # shows the button disabled if you're too early — that's not an error.
  auto_bump_resume: false
  # Опциональное обслуживание: отменяет зависшие отклики (в статусе
  # "отказ", или без изменений дольше cleanup_older_than_days) кликом
  # "Отменить отклик" на hh.ru. Деструктивно (реальные отклики на
  # аккаунте) — НЕ входит в основной цикл поиска/отклика, запускается
  # только вручную (пункт меню "Clean up stale HeadHunter negotiations"
  # или `--auto cleanup_hh_negotiations`). При false — вообще ничего не
  # делает, даже если запущено вручную.
  auto_cleanup_negotiations: false
  cleanup_older_than_days: 30

# check_hh_replies — отдельное расписание для проверки чата hh.ru
# (headhunter.auto_reply выше должен быть true, иначе это расписание
# ничего не делает). Toplevel-блок, не внутри headhunter: — планировщик
# ищет источники по имени ключа верхнего уровня, а проверка чата — не
# "поиск+отклик", а отдельная задача со своим интервалом (обычно чаще,
# чем headhunter.interval_hours у поиска).
check_hh_replies:
  schedule_enabled: false
  interval_hours: 1

# Optional: only needed for the "Search & Apply on GetMatch" action.
# Keep auto_apply: false until you've logged in once (first auto_apply
# run opens a real browser window and waits for you to type the code
# GetMatch sends to your Telegram) — see docs/GUIDE.md.
getmatch:
  auto_apply: false

# Optional: only needed for the "Search & Apply on geekjob.ru" action.
# Logs in only via OAuth (Google, VK, Mail.Ru, etc.) — no password is
# ever entered by code, you complete login by hand in the browser
# window that opens on the first auto_apply run. Best-effort: unlike
# HH/GetMatch, the actual apply button was never confirmed against a
# live logged-in session (see docs/GUIDE.md) — if the button isn't
# found, it just falls back to dry-run.
geekjob:
  auto_apply: false

# Optional: only needed for the "Search Telegram channels" action.
# `positions` above is reused as the search keywords. Also editable from
# the dashboard's own "Telegram" tab — see docs/GUIDE.md.
telegram:
  # username или полная ссылка (https://t.me/username) — оба формата
  # принимаются, см. telegram.client.normalize_channel.
  channels:
    - some_public_job_channel
  messages_per_channel: 100
  # Посты старше стольки дней не рассматриваются вообще — иначе
  # messages_per_channel листает вглубь редко постящего канала и легко
  # находит вакансию месячной давности, по которой писать уже поздно.
  max_post_age_days: 7
  # Если в посте нашёлся ровно один @username-контакт — писать ему
  # первым коротким приветствием (см. intro_message_template ниже) с
  # человекоподобными паузами (2-10 минут) и дневным лимитом. По
  # умолчанию выключено — без этого посты просто попадают в отчёт для
  # ручного ответа, как раньше.
  auto_message: false
  daily_message_limit: 15
  # Слать сообщения только в эти часы (по времени машины) — иначе
  # холодное сообщение в 4 утра выглядит совсем не по-человечески.
  # Не заданы — шлёт в любое время.
  active_hours_start: 9
  active_hours_end: 21
  # {role}/{link} подставляются на конкретную вакансию. Специально
  # короткое — сразу вываливать резюме/длинное письмо незнакомцу похоже
  # на рассылку ботом; продолжать разговор (в т.ч. присылать резюме) —
  # вручную, из вкладки "Telegram" → "Диалоги" в дашборде.
  intro_message_template: >-
    Здравствуйте! Заинтересовала вакансия «{role}» ({link}).
    Расскажу подробнее о себе, если ещё актуально.

# check_telegram_replies — отдельное расписание, проверяет диалоги,
# заведённые telegram.auto_message, на новые ответы (только уведомление,
# без автоответа — см. check_hh_replies выше про общий смысл отдельного
# расписания под проверку чата).
check_telegram_replies:
  schedule_enabled: false
  interval_hours: 1

# Optional: only needed for the "Search & Apply on LinkedIn" action.
# Keep auto_apply: false until you've reviewed a dry run's generated
# screening-question answers — this flow is unverified against a live
# LinkedIn account, see docs/GUIDE.md.
linkedin:
  auto_apply: false
  # Пусто/не задано — поиск по всему миру (LinkedIn geoId=Worldwide),
  # только среди remote-вакансий. Если нужно ограничиться конкретными
  # странами (например под собственные Job preferences в самом
  # LinkedIn-аккаунте) — перечислите их списком:
  # locations:
  #   - "Germany"
  #   - "Netherlands"
  locations: []

# Optional: only needed for the "Search & Apply on Habr Career" action.
# Keep auto_apply: false until you've reviewed a dry run — this flow is
# unverified against a live career.habr.com account, see docs/GUIDE.md.
habr_career:
  auto_apply: false

