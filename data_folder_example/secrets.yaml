# "Search & Apply on HeadHunter" needs no secrets here at all — hh.ru
# has no usable public API for this without registering and getting an
# app approved by HH (not guaranteed, and easy to get flagged in the
# meantime). Instead, a real Chrome window opens on first run and you
# log in by hand with your phone number + the SMS code, same as
# rabota.ru/GetMatch/LinkedIn below. The session then stays in a
# persistent browser profile — no repeat logins.

# Optional: only needed for the "Search & Apply on SuperJob" action.
# Register an app at https://api.superjob.ru/register/ to get these.
superjob:
  client_id: ""
  client_secret: ""

# Optional: only needed for the "Search & Apply on Zarplata.ru" action.
zarplata:
  client_id: ""
  client_secret: ""

# Optional: only needed for the "Search Telegram channels" action.
# Get these at https://my.telegram.org/apps (your personal account, not a bot).
telegram:
  api_id: ""
  api_hash: ""

# Optional: only needed for the "Search & Apply on GetMatch" action.
# GetMatch logs in with a code sent to your Telegram, not a password —
# only the email/telegram identifier goes here; the code is entered by
# hand in the browser window that opens on first run.
getmatch:
  email: ""

# Optional: only needed for the "Search & Apply on LinkedIn" action.
# Your regular LinkedIn login — not an API key, LinkedIn has no public one.
linkedin:
  email: ""
  password: ""

# Optional: Telegram notifications (run summaries, daily limit reached,
# new employer replies). Create a bot via @BotFather to get the token,
# then message the bot once and check
# https://api.telegram.org/bot<TOKEN>/getUpdates for your chat_id.
notifications:
  telegram_bot_token: ""
  telegram_chat_id: ""

# Optional: used only when headhunter.auto_reply is on, for technical
# questions from employers — public GitHub profile as extra LLM
# context. token is optional (raises the 60 req/hour unauthenticated
# rate limit, not required for personal use).
github:
  username: ""
  token: ""